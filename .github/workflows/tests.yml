# Required check "tests": tooling unit tests, practice-round validation and
# the Maven tests of every passed round and changed skill. Kept to one job
# to save Actions minutes (spec 8.8).
name: tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests for repo tooling
        run: python3 -m unittest discover -s tests -t .

      - name: Validate rounds and file rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: python3 eval/validate_round.py --base "$BASE_SHA" --head-ref "$HEAD_REF"

      - name: Maven tests (passed rounds and changed skills)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          while read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::mvn test $dir"
            # Build with main's template pom, not the PR's own, so a round can't
            # skip or weaken its tests (for example maven.test.skip).
            git show "$BASE_SHA:templates/java/pom.xml" \
              | sed "s|<artifactId>CHANGE_ME</artifactId>|<artifactId>$(basename "$dir")</artifactId>|" > "$dir/pom.xml"
            if (cd "$dir" && mvn -B test > "$RUNNER_TEMP/mvn.log" 2>&1); then mvn_ok=1; else mvn_ok=0; fi
            grep -E "Tests run:|BUILD|ERROR" "$RUNNER_TEMP/mvn.log" | tail -n 8 || true
            if [ "$mvn_ok" = 1 ]; then
              # Green only counts if tests really ran: at least one report, no failures or skips.
              python3 -c "import sys; from eval.score import task_passed; sys.exit(0 if task_passed(sys.argv[1]) else 1)" \
                "$dir/target/surefire-reports" || { echo "no passing test reports in $dir"; status=1; }
            else
              status=1
            fi
            echo "::endgroup::"
          done < maven-dirs.txt
          exit $status
